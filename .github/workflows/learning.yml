name: Portable learning validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run learning:check
      - run: npx playwright install --with-deps chromium
      - run: npm run learning:browser
      - run: npm run learning:connected-browser
